<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171512"><title>Catálogo | Decor & Home</title>
<meta name="description" content="Catálogo visual Decor & Home. Desliza horizontalmente y solicita información por WhatsApp.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171512;font-family:Arial,Helvetica,sans-serif}.top{position:fixed;z-index:20;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) 18px 14px;display:flex;justify-content:space-between;color:#fff;background:linear-gradient(#0009,transparent)}.brand{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.count{font-size:11px;letter-spacing:.12em}.track{width:100%;height:100svh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}.card{min-width:100vw;height:100svh;scroll-snap-align:start;position:relative;overflow:hidden;background:#292622}.card img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.72))}.info{position:absolute;left:20px;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));color:#fff}.info small{font-size:10px;letter-spacing:.18em;text-transform:uppercase}.info h2{font-size:27px;line-height:1;margin:8px 0 0;max-width:82%;font-weight:500}.empty{min-width:100vw;height:100svh;scroll-snap-align:start;display:grid;place-items:center;padding:32px;text-align:center;color:#fff}.empty h1{font-size:28px;font-weight:500;margin:0 0 12px}.empty p{line-height:1.5;color:#c9c2b9;margin:0}.hint{position:fixed;z-index:25;right:18px;top:50%;color:#fff;font-size:24px;text-shadow:0 2px 8px #000}.dock{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.dock a{flex:1;text-decoration:none;text-align:center;padding:16px 14px;border-radius:999px;font-size:13px;font-weight:700}.back{background:#fff;color:#201d1a}.wa{background:#25D366;color:#07180c}
</style></head><body>
<header class="top"><span class="brand">Decor & Home</span><span class="count" id="count">CATÁLOGO</span></header>
<main class="track" id="catalog"><section class="empty"><div><h1>Catálogo Decor & Home</h1><p>Desliza horizontalmente para explorar la colección. Estamos incorporando las fotografías del catálogo.</p></div></section></main>
<div class="hint" aria-hidden="true">›</div>
<nav class="dock"><a class="back" href="https://decorandhome.com.mx/">Inicio</a><a class="wa" href="https://wa.me/528181381986?text=Hola%20Decor%20%26%20Home%2C%20vi%20su%20cat%C3%A1logo%20y%20quiero%20informaci%C3%B3n." target="_blank" rel="noopener">WhatsApp</a></nav>
<script>
const products=[];
const root=document.querySelector('#catalog');
if(products.length){root.innerHTML=products.map((p,i)=>`<section class="card"><img src="${p.image}" alt="${p.name}" loading="${i<2?'eager':'lazy'}"><div class="shade"></div><div class="info"><small>${p.category||'Decor & Home'} · ${String(i+1).padStart(2,'0')}</small><h2>${p.name}</h2></div></section>`).join('');document.querySelector('#count').textContent=products.length+' PRODUCTOS'}
</script></body></html>
