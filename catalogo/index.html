<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec"><title>Catálogo | Decor & Home</title>
<meta name="description" content="Catálogo visual Decor & Home. Descubre acabados y solicita información por WhatsApp.">
<style>
*{box-sizing:border-box}html{scroll-snap-type:y mandatory;background:#f5f2ec}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#201d1a;background:#f5f2ec}.top{position:fixed;z-index:20;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) 18px 14px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#0008,transparent);color:#fff}.brand{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.count{font-size:11px;letter-spacing:.12em}.card{height:100svh;scroll-snap-align:start;position:relative;overflow:hidden;background:#ddd}.card img{width:100%;height:100%;object-fit:cover;display:block}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.72) 100%)}.info{position:absolute;left:20px;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));color:white}.info small{font-size:10px;letter-spacing:.18em;text-transform:uppercase}.info h2{font-size:27px;line-height:1;margin:8px 0 0;max-width:80%;font-weight:500}.dock{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.dock a{flex:1;text-decoration:none;text-align:center;padding:16px 14px;border-radius:999px;font-size:13px;font-weight:700}.back{background:#fff;color:#201d1a}.wa{background:#25D366;color:#07180c}.empty{min-height:100svh;display:grid;place-items:center;padding:30px;text-align:center}.empty h1{font-weight:500}.empty p{line-height:1.5;color:#6b645e}
</style></head><body>
<header class="top"><span class="brand">Decor & Home</span><span class="count" id="count">CATÁLOGO</span></header>
<main id="catalog"><section class="empty"><div><h1>Catálogo Decor & Home</h1><p>Estamos cargando la primera selección de productos. Usa WhatsApp para recibir atención inmediata.</p></div></section></main>
<nav class="dock"><a class="back" href="/">Inicio</a><a class="wa" id="wa" href="https://wa.me/528181381986?text=Hola%20Decor%20%26%20Home%2C%20vi%20su%20cat%C3%A1logo%20y%20quiero%20informaci%C3%B3n." target="_blank" rel="noopener">WhatsApp</a></nav>
<script>
/* Las fotografías del catálogo se incorporan como assets propios en /catalogo/img/ para conservar calidad y control. */
const products=[];
const root=document.querySelector('#catalog');
if(products.length){root.innerHTML=products.map((p,i)=>`<section class="card"><img src="${p.image}" alt="${p.name}" loading="${i<2?'eager':'lazy'}"><div class="shade"></div><div class="info"><small>${p.category||'Decor & Home'} · ${String(i+1).padStart(2,'0')}</small><h2>${p.name}</h2></div></section>`).join('');document.querySelector('#count').textContent=products.length+' PRODUCTOS'}
</script></body></html>
